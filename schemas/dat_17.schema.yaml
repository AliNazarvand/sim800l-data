$schema: http://json-schema.org/draft-07/schema#
title: dat_17
type: object
required:
- id
- category
- source
- source_type
- confidence
- status
- applicable_models
properties:
  id:
    type: string
  category:
    type: string
  source:
    type: object
  source_type:
    type: string
    enum:
    - primary
    - secondary
    - external
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
  status:
    type: string
    enum:
    - complete
    - partial
    - unknown
    - inferred
    - blocked
    - deferred
  conflicts:
    type: array
  notes:
    type: string
  tags:
    type: array
  applicable_models:
    type: array
  created_at:
    type: string
  updated_at:
    type: string
  coverage_estimate:
    type: string
    enum:
    - high
    - medium
    - low
additionalProperties: true
